[package]
name = "pegastore-rdma"
description = "RDMA (RC verbs) transfer engine for pegastore, relocated from pegaflow-transfer v1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sideway = "0.4.3"
rdma-mummy-sys = "0.2.4"
mea = "0.6.3"
parking_lot = "0.12"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }
thiserror = "2.0"
libc = "0.2"

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
pegastore-cuda = { path = "../pegastore-cuda" }

[[example]]
name = "cpu_bench"

[[example]]
name = "gpu_rdma_bench"
